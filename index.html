<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>12 Pubs Of Winter</title>
<meta name="description" content="12 Pubs Of Winter. One pub a day until Wednesday 2 December.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="12 Pubs">
<meta property="og:title" content="12 Pubs Of Winter">
<meta property="og:description" content="A new door opens every day at noon. Wednesday 2 December, 15:30.">
<meta property="og:image" content="https://12pubs.eu/icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=39">
</head>
<body>

<!-- SIGN-IN -->
<section id="gate" class="gate" hidden>
  <p class="gate-kicker">Dublin &middot; Wednesday 2 December</p>
  <h1 class="gate-title">12 Pubs <small>of Winter</small></h1>
  <div class="bigdoor" id="bigDoor" aria-hidden="true"></div>
  <p class="gate-count" id="gateCount"></p>
  <form id="gateForm" class="gate-form" novalidate>
    <label for="gName">Name at the door</label>
    <input id="gName" name="nickname" autocomplete="off" placeholder="What the lads call you" maxlength="40" required
           data-1p-ignore data-lpignore="true" data-protonpass-ignore="true">
    <button class="btn brass big" id="gateBtn" type="submit">Let me in</button>
    <p class="gate-msg" id="gateMsg" role="alert"></p>
  </form>
</section>

<!-- APP -->
<div id="app" class="app" hidden>
  <header class="top">
    <div class="fascia small"><span class="screw"></span><h1>12 Pubs Of Winter<sup>*</sup></h1><span class="screw"></span></div>
    <p class="footnote">*we don't want to offend anyone, you bunch of cunts</p>
    <div class="top-row">
      <p class="top-status" id="topStatus"></p>
      <button class="ring" id="ring" type="button" aria-label="Doors open"></button>
    </div>
  </header>

  <main id="views">
    <section class="view" id="v-doors" data-view="doors"></section>
    <section class="view" id="v-map" data-view="map" hidden><p class="map-note" id="mapNote"></p><div id="map"></div><button class="fab" id="locate" type="button">Where am I?</button></section>
    <section class="view" id="v-admin" data-view="admin" hidden></section>
    <section class="view" id="v-me" data-view="me" hidden></section>
  </main>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="doors" aria-current="page"><span class="ti">🚪</span><span id="doorsLabel">Doors</span></button>
    <button type="button" data-tab="map"><span class="ti">🗺️</span>Map</button>
    <button type="button" data-tab="me"><span class="ti">🪓</span>You</button>
    <button type="button" data-tab="admin" id="adminTab" hidden><span class="ti">🔑</span>Admin</button>
  </nav>
</div>

<!-- PUB SHEET -->
<div class="sheet-wrap" id="pubSheet" hidden>
  <div class="sheet pub-sheet" role="dialog" aria-modal="true" aria-labelledby="psName">
    <button class="x" id="psClose" type="button" aria-label="Close">✕</button>
    <div id="psBody"></div>
  </div>
</div>

<!-- CHECK-IN SHEET -->
<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <p class="kicker" id="sheetSlot"></p>
    <h2 id="sheetTitle"></h2>
    <label class="photo-pick" id="photoPick">
      <input type="file" id="photo" accept="image/*" capture="environment">
      <img id="photoPrev" alt="" hidden>
      <span id="photoHint">📸 Take a photo of the pint, the pub or the state of the lads</span>
    </label>
    <p class="loc" id="loc">Checking where you are…</p>
    <div class="sheet-actions">
      <button class="btn ghost" id="sheetCancel" type="button">Cancel</button>
      <button class="btn brass" id="sheetGo" type="button" disabled>Check in</button>
    </div>
    <p class="fine" id="sheetMsg" role="status"></p>
  </div>
</div>

<!-- STREET VIEW, FULL SCREEN -->
<div class="viewer" id="svView" role="dialog" aria-modal="true" aria-labelledby="svName" hidden>
  <div class="viewer-bar"><b id="svName"></b><button class="btn brass small" id="svDone" type="button">Done</button></div>
  <iframe id="svFrame" title="Street view" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
  <p class="viewer-hint">Drag to look around. Tap Done to go back.</p>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js?v=39"></script>
</body>
</html>
