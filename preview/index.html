<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>12 Pubs Preview</title>
<meta name="description" content="12 Pubs Of Winter. One pub a day until Wednesday 2 December.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="12 Pubs">
<meta property="og:title" content="12 Pubs Of Winter">
<meta property="og:description" content="A new door opens every day at noon. Wednesday 2 December, 15:30.">
<meta property="og:image" content="https://12pubs.eu/icon-512.png">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=31">
</head>
<body>

<!-- SIGN-IN -->
<section id="gate" class="gate" hidden>
  <div class="fascia"><span class="screw"></span><h1>12 Pubs<br>of Winter</h1><span class="screw"></span></div>
  <p class="gate-when" id="gateWhen">Wednesday 2 December, 15:30</p>
  <div class="wall gate-wall" id="gateDoors" aria-hidden="true"></div>
  <p class="gate-count" id="gateCount"></p>
  <form id="gateForm" class="gate-form" novalidate>
    <label for="gName">Your name</label>
    <input id="gName" name="name" autocomplete="given-name" placeholder="What the lads call you" maxlength="40">
    <label for="gEmail">Email</label>
    <input id="gEmail" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
    <button class="btn brass big" id="gateBtn" type="submit">Let me in</button>
    <p class="gate-msg" id="gateMsg" role="alert"></p>
  </form>
  <p class="fine">Your email keeps your check-ins yours. Nobody else sees it.</p>
</section>

<!-- APP -->
<div id="app" class="app" hidden>
  <header class="top">
    <div class="fascia small"><span class="screw"></span><h1>12 Pubs of Winter</h1><span class="screw"></span></div>
    <div class="top-row">
      <p class="top-status" id="topStatus"></p>
      <button class="ring" id="ring" type="button" aria-label="Your progress"></button>
    </div>
  </header>

  <main id="views">
    <section class="view" id="v-doors" data-view="doors"></section>
    <section class="view" id="v-board" data-view="board" hidden></section>
    <section class="view" id="v-map" data-view="map" hidden><p class="map-note" id="mapNote"></p><div id="map"></div><button class="fab" id="locate" type="button">Where am I?</button></section>
    <section class="view" id="v-admin" data-view="admin" hidden></section>
    <section class="view" id="v-me" data-view="me" hidden></section>
  </main>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="doors" aria-current="page"><span class="ti">🚪</span><span id="doorsLabel">Doors</span></button>
    <button type="button" data-tab="board"><span class="ti">🏆</span>Board</button>
    <button type="button" data-tab="map"><span class="ti">🗺️</span>Map</button>
    <button type="button" data-tab="me"><span class="ti">🪓</span>You</button>
    <button type="button" data-tab="admin" id="adminTab" hidden><span class="ti">🔑</span>Admin</button>
  </nav>
</div>

<!-- PUB SHEET -->
<div class="sheet-wrap" id="pubSheet" hidden>
  <div class="sheet pub-sheet" role="dialog" aria-modal="true" aria-labelledby="psName">
    <button class="x" id="psClose" type="button" aria-label="Close">✕</button>
    <div id="psBody"></div>
  </div>
</div>

<!-- CHECK-IN SHEET -->
<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <p class="kicker" id="sheetSlot"></p>
    <h2 id="sheetTitle"></h2>
    <label class="photo-pick" id="photoPick">
      <input type="file" id="photo" accept="image/*" capture="environment">
      <img id="photoPrev" alt="" hidden>
      <span id="photoHint">📸 Take a photo of the pint, the pub or the state of the lads</span>
    </label>
    <p class="loc" id="loc">Checking where you are…</p>
    <div class="sheet-actions">
      <button class="btn ghost" id="sheetCancel" type="button">Cancel</button>
      <button class="btn brass" id="sheetGo" type="button" disabled>Check in</button>
    </div>
    <p class="fine" id="sheetMsg" role="status"></p>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<div id="pvGate" style="position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;background:#14213D;color:#F2EDE3;font:16px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif">
  <form id="pvForm" style="width:100%;max-width:360px;display:grid;gap:10px">
    <h1 style="margin:0;font:28px/1.1 'Alfa Slab One',Georgia,serif;color:#F3D27C">12 Pubs preview</h1>
    <p style="margin:0;color:#AEB8CB">A test copy with made-up lads and a time machine. Nothing here touches the real guest list.</p>
    <label for="pvCode" style="font-weight:700">Preview code</label>
    <input id="pvCode" autocomplete="off" autocapitalize="off" style="min-height:52px;padding:10px 12px;border-radius:10px;border:2px solid rgba(201,195,182,.3);background:#1B2B4D;color:inherit;font:inherit">
    <button type="submit" style="min-height:52px;border-radius:10px;border:0;background:#E0B54A;color:#22190A;font:700 17px/1 inherit;cursor:pointer">Open the preview</button>
    <p id="pvErr" role="alert" style="margin:0;min-height:1.5em;color:#EE7666;font-weight:700"></p>
  </form>
</div>
<script>
(function(){
  var SB='https://afijpjkgkknhsmtriqzq.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmaWpwamtna2tuaHNtdHJpcXpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyMDMyMDYsImV4cCI6MjExMDc3OTIwNn0.uWTbmFrr2A8TtvfgxKCp0H2ssHXHttnpirDv_iia2oY';
  function load(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.body.appendChild(s); }); }
  async function go(code){
    var r = await fetch(SB+'/rest/v1/rpc/preview_data',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_code:code})});
    var d = await r.json();
    if(!r.ok || !d || d.error) throw new Error('bad');
    window.PREVIEW_DATA = d;
    try{ sessionStorage.setItem('pv:code', code); }catch(e){}
    document.getElementById('pvGate').remove();
    await load('preview.js?v=31'); await load('app.js?v=31');
  }
  var saved=null; try{ saved=sessionStorage.getItem('pv:code'); }catch(e){}
  if(saved) go(saved).catch(function(){});
  document.getElementById('pvForm').addEventListener('submit', function(e){
    e.preventDefault(); document.getElementById('pvErr').textContent='';
    go(document.getElementById('pvCode').value.trim()).catch(function(){ document.getElementById('pvErr').textContent='That code didn\'t work. Check it with Kevin.'; });
  });
})();
</script>
</body>
</html>
